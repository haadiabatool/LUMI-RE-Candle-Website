<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMIÈRE Candles - My Wishlist</title>
  <link rel="stylesheet" href="styles.css">
  <style>

    /* Minimalist Navbar */
    .product-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 4rem;
      border-bottom: 1px solid rgba(216, 167, 167, 0.2);
      background-color: var(--rosewood);
    }
    .product-nav .logo {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      color: #FFF7EF;
      text-decoration: none;
      letter-spacing: 0.1em;
    }
    .btn-back {
      font-family: var(--font-body);
      background-color: var(--rosewood);
      color: #FFF7EF;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    .btn-back:hover {
      color: var(--deep-plum);
    }

    .wishlist-container {
      max-width: 1200px;
      margin: 4rem auto;
      padding: 0 2rem;
    }
    .btn-back-to-collections{
      background-color: #49313F;
      color:#FFF7EF;
      margin:2rem;
      padding:1rem;
      border-radius: 12px;
    }
    .wishlist-title {
      font-family: var(--font-heading);
      font-size: 2.5rem;
      color: var(--deep-plum);
      margin-bottom: 2rem;
      text-align: center;
    }
    .wishlist-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2rem;
    }
    @media (max-width: 1024px) { .wishlist-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .wishlist-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

     <!-- Minimalist Navbar -->
  <nav class="product-nav">
    <a href="index.html" class="logo">LUMIÈRE</a>
    <a href="javascript:history.back()" class="btn-back">← Back</a>
  </nav>

  <div class="wishlist-container">
   
    <h1 class="wishlist-title">My Favorite Candles</h1>

    <div class="wishlist-grid" id="wishlistGrid">
      <!-- Injected via JS -->
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const wishlistGrid = document.getElementById('wishlistGrid');

      function loadWishlistPage() {
        let wishlist = JSON.parse(localStorage.getItem('lumiere_wishlist')) || [];

        if (wishlist.length === 0) {
          wishlistGrid.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 4rem;">
              <p style="font-size: 1.2rem; color: var(--rosewood); margin-bottom: 1.5rem;">Your wishlist is currently empty.</p>
              <a href="index.html" class="btn-view-all" style="display:inline-block;">Explore Collection</a>
            </div>
          `;
          return;
        }

        wishlistGrid.innerHTML = '';
        wishlist.forEach((item, index) => {
          const cardHTML = `
            <div class="explore-card">
              <div class="explore-card-img-wrapper" style="height: 220px; position: relative;">
                <button onclick="removeWishlistItem(${index})" style="position:absolute; top:10px; right:10px; background:#fff; border:none; border-radius:50%; width:30px; height:30px; cursor:pointer; color:#d9534f; font-weight:bold;">&times;</button>
                <img src="${item.img}" alt="${item.name}" style="width:100%; height:100%; object-fit:cover;">
              </div>
              <div class="explore-card-body" style="padding: 1.25rem;">
                <h4 class="explore-card-title">${item.name}</h4>
                <div class="explore-card-footer" style="margin-top: 1rem;">
                  <span class="explore-card-price">Rs. ${Number(item.price).toLocaleString()}</span>
                  <button class="btn-explore-add-cart" onclick="moveToCart('${item.id}', '${item.name}', '${item.price}', '${item.img}')">Add to Bag</button>
                </div>
              </div>
            </div>
          `;
          wishlistGrid.insertAdjacentHTML('beforeend', cardHTML);
        });
      }

      window.removeWishlistItem = function(index) {
        let wishlist = JSON.parse(localStorage.getItem('lumiere_wishlist')) || [];
        wishlist.splice(index, 1);
        localStorage.setItem('lumiere_wishlist', JSON.stringify(wishlist));
        loadWishlistPage();
      }

      window.moveToCart = function(id, name, price, img) {
        let cart = JSON.parse(localStorage.getItem('lumiere_cart')) || [];
        cart.push({ id, name, price, img });
        localStorage.setItem('lumiere_cart', JSON.stringify(cart));
        alert(`${name} has been added to your shopping bag!`);
      }

      loadWishlistPage();
    });
  </script>
  
</body>
</html>
