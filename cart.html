<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMIÈRE Candles - Shopping Bag</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      /* Fallback variables in case styles.css doesn't define them */
      --rosewood: #986B70;
      --deep-plum: #3B232B;
      --soft-cream: #FFF7EF;
      --font-heading: 'Georgia', serif;
      --font-body: 'Segoe UI', sans-serif;
      --transition-smooth: all 0.25s ease;
    }

    body {
      background-color: var(--soft-cream);
      font-family: var(--font-body);
      margin: 0;
      color: var(--deep-plum);
    }

    /* Minimalist Navbar */
    .product-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 4rem;
      border-bottom: 1px solid rgba(216, 167, 167, 0.2);
      background-color: var(--rosewood);
    }

    .product-nav .logo {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      color: #FFF7EF;
      text-decoration: none;
      letter-spacing: 0.1em;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .btn-back,
    .nav-link-btn {
      font-family: var(--font-body);
      background: transparent;
      border: none;
      color: #FFF7EF;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-back:hover,
    .nav-link-btn:hover {
      opacity: 0.8;
    }

    .user-badge {
      background: rgba(255, 247, 239, 0.18);
      padding: 0.35rem 0.85rem;
      border-radius: 20px;
      color: #FFF7EF;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Main Container */
    .cart-page-container {
      max-width: 1200px;
      margin: 3.5rem auto;
      padding: 0 2rem;
    }

    .cart-title {
      font-family: var(--font-heading);
      font-size: 2.5rem;
      color: var(--deep-plum);
      margin-bottom: 2rem;
      text-align: center;
    }

    .cart-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 3rem;
    }

    /* Select All Bar */
    .select-all-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 0.9rem 1.25rem;
      border-radius: 10px;
      border: 1px solid rgba(216, 167, 167, 0.3);
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      user-select: none;
    }

    input[type="checkbox"].lumiere-checkbox {
      width: 19px;
      height: 19px;
      accent-color: var(--rosewood);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Cart Items */
    .cart-items-list {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .cart-item-card {
      display: flex;
      align-items: center;
      background: #fff;
      padding: 1.25rem;
      border-radius: 10px;
      border: 1px solid rgba(216, 167, 167, 0.3);
      gap: 1.25rem;
      transition: var(--transition-smooth);
    }

    .cart-item-card.unchecked {
      opacity: 0.6;
      background: #fafafa;
    }

    .cart-item-img {
      width: 85px;
      height: 85px;
      object-fit: cover;
      border-radius: 6px;
    }

    .cart-item-info {
      flex-grow: 1;
    }

    .cart-item-name {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      color: var(--deep-plum);
      margin: 0 0 0.3rem 0;
    }

    .cart-item-price {
      font-weight: 600;
      color: var(--rosewood);
      margin: 0;
    }

    .btn-remove {
      background: transparent;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 0.85rem;
      transition: color 0.2s;
    }

    .btn-remove:hover {
      color: #d9534f;
    }

    /* Summary Box */
    .cart-summary-box {
      background: #FFFFFF;
      padding: 2rem;
      border-radius: 10px;
      border: 1px solid rgba(216, 167, 167, 0.4);
      height: fit-content;
      position: sticky;
      top: 2rem;
    }

    .summary-title {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      color: var(--deep-plum);
      margin: 0 0 1.25rem 0;
      border-bottom: 1px solid rgba(152, 107, 112, 0.15);
      padding-bottom: 0.5rem;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 0.95rem;
      color: var(--deep-plum);
    }

    .summary-total {
      font-weight: 700;
      font-size: 1.2rem;
      border-top: 1px solid rgba(152, 107, 112, 0.15);
      padding-top: 1rem;
      margin-top: 1rem;
    }

    .btn-order-now {
      display: block;
      width: 100%;
      padding: 0.9rem;
      background-color: var(--rosewood);
      color: var(--soft-cream);
      border: none;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      text-align: center;
      margin-top: 1.5rem;
      transition: var(--transition-smooth);
      text-decoration: none;
    }

    .btn-order-now:hover:not(:disabled) {
      background-color: var(--deep-plum);
    }

    .btn-order-now:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    /* My Orders Section */
    .my-orders-section {
      margin-top: 5rem;
      padding-top: 3rem;
      border-top: 1px solid rgba(152, 107, 112, 0.25);
    }

    .orders-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .orders-header h2 {
      font-family: var(--font-heading);
      font-size: 2rem;
      color: var(--deep-plum);
      margin: 0;
    }

    .order-card {
      background: #fff;
      border: 1px solid rgba(216, 167, 167, 0.4);
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }

    .order-card-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding-bottom: 1rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(152, 107, 112, 0.15);
    }

    .tracking-pill {
      background: var(--soft-cream);
      border: 1px solid var(--rosewood);
      color: var(--deep-plum);
      padding: 0.35rem 0.85rem;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }

    .status-badge {
      background: #e6f4ea;
      color: #1e7e34;
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .order-items-mini {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .order-mini-item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      background: var(--soft-cream);
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .order-mini-item img {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      object-fit: cover;
    }

    .order-card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      color: var(--rosewood);
    }

    /* Sign In Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(59, 35, 43, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #fff;
      max-width: 420px;
      width: 100%;
      padding: 2.25rem;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1.25rem;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #888;
      cursor: pointer;
    }

    .modal-title {
      font-family: var(--font-heading);
      font-size: 1.65rem;
      color: var(--deep-plum);
      margin: 0 0 0.4rem 0;
      text-align: center;
    }

    .modal-subtitle {
      text-align: center;
      color: var(--rosewood);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: var(--deep-plum);
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid rgba(152, 107, 112, 0.4);
      border-radius: 6px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--rosewood);
    }

    /* User Profile Icon & Dropdown */
    .user-menu-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .user-icon-btn {
      background: rgba(255, 247, 239, 0.16);
      border: 1px solid rgba(255, 247, 239, 0.35);
      color: #FFF7EF;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .user-icon-btn:hover {
      background: rgba(255, 247, 239, 0.28);
    }

    .user-dropdown {
      position: absolute;
      top: 48px;
      right: 0;
      width: 240px;
      background: #FFFFFF;
      color: var(--deep-plum);
      border-radius: 10px;
      border: 1px solid rgba(216, 167, 167, 0.45);
      box-shadow: 0 10px 28px rgba(59, 35, 43, 0.16);
      padding: 1rem;
      display: none;
      z-index: 999;
    }

    .user-dropdown.open {
      display: block;
    }

    .user-dropdown-info {
      border-bottom: 1px solid rgba(152, 107, 112, 0.18);
      padding-bottom: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .user-dropdown-name {
      font-family: var(--font-heading);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--deep-plum);
      margin: 0 0 0.2rem 0;
    }

    .user-dropdown-detail {
      font-size: 0.82rem;
      color: var(--rosewood);
      margin: 0.15rem 0;
      word-break: break-word;
    }

    .btn-dropdown-logout {
      width: 100%;
      padding: 0.55rem;
      background: var(--soft-cream);
      color: #b53834;
      border: 1px solid rgba(181, 56, 52, 0.25);
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .btn-dropdown-logout:hover {
      background: #b53834;
      color: #fff;
    }

    @media (max-width: 768px) {
      .product-nav {
        padding: 1.2rem 1.5rem;
      }

      .cart-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- Minimalist Navbar -->
  <nav class="product-nav">
    <a href="index.html" class="logo">LUMIÈRE</a>
    <div class="nav-actions">
      <a href="#myOrdersSection" class="nav-link-btn">My Orders (<span id="navOrderCount">0</span>)</a>
      <span id="userNavArea"></span>
      <a href="javascript:history.back()" class="btn-back">← Back</a>
    </div>
  </nav>

  <div class="cart-page-container">
    <h1 class="cart-title">Your Shopping Bag</h1>

    <div class="cart-grid" id="cartGrid">
      <!-- Injected via JS -->
    </div>

    <!-- My Orders Section -->
    <section class="my-orders-section" id="myOrdersSection">
      <div class="orders-header">
        <h2>My Orders</h2>
      </div>
      <div id="ordersListContainer">
        <!-- Placed orders injected here -->
      </div>
    </section>
  </div>

  <!-- Sign In / Login Modal -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeAuthModal()">&times;</button>
      <h2 class="modal-title">Sign In to Continue</h2>
      <p class="modal-subtitle">Please sign in to place your LUMIÈRE order and receive your tracking ID.</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="userName">Full Name</label>
          <input type="text" id="userName" placeholder="e.g., Ayesha Khan" required>
        </div>
        <div class="form-group">
          <label for="userEmail">Email or Phone Number</label>
          <input type="text" id="userEmail" placeholder="e.g., ayesha@example.com" required>
        </div>
        <div class="form-group">
          <label for="userAddress">Delivery Address</label>
          <input type="text" id="userAddress" placeholder="House #, Street, City" required>
        </div>
        <button type="submit" class="btn-order-now">Sign In & Place Order</button>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cartGrid = document.getElementById('cartGrid');
      const ordersListContainer = document.getElementById('ordersListContainer');
      const authModal = document.getElementById('authModal');
      const loginForm = document.getElementById('loginForm');
      const userNavArea = document.getElementById('userNavArea');
      const navOrderCount = document.getElementById('navOrderCount');

      // Track selected item indices in current session
      let selectedIndices = new Set();
      let isInitialized = false;

      function getCart() {
        return JSON.parse(localStorage.getItem('lumiere_cart')) || [];
      }

      function getCurrentUser() {
        return JSON.parse(localStorage.getItem('lumiere_user')) || null;
      }

      function getOrders() {
        return JSON.parse(localStorage.getItem('lumiere_orders')) || [];
      }

      function cleanPrice(price) {
        let num = typeof price === 'string' ? Number(price.replace(/,/g, '')) : Number(price);
        return isNaN(num) ? 0 : num;
      }

      // Render Navbar User State
      function renderUserNav() {
        const user = getCurrentUser();
        const orders = getOrders();
        navOrderCount.textContent = orders.length;

        if (user) {
          userNavArea.innerHTML = `
      <div class="user-menu-wrapper">
        <button class="user-icon-btn" onclick="toggleUserDropdown(event)" title="${user.name}">
          <!-- Person SVG Icon -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>

        <div class="user-dropdown" id="userDropdown">
          <div class="user-dropdown-info">
            <p class="user-dropdown-name">${user.name}</p>
            <p class="user-dropdown-detail">${user.contact}</p>
            ${user.address ? `<p class="user-dropdown-detail">📍 ${user.address}</p>` : ''}
          </div>
          <button class="btn-dropdown-logout" onclick="logoutUser()">Logout</button>
        </div>
      </div>
    `;
        } else {
          userNavArea.innerHTML = `
      <button onclick="openAuthModal(false)" class="nav-link-btn" style="display:inline-flex;align-items:center;gap:6px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        Sign In
      </button>
    `;
        }
      }

      // Render Cart Page with Checkboxes
      function loadCartPage() {
        const cart = getCart();

        // By default on first load, select all items
        if (!isInitialized) {
          cart.forEach((_, idx) => selectedIndices.add(idx));
          isInitialized = true;
        }

        if (cart.length === 0) {
          cartGrid.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 4rem; background: #fff; border-radius: 10px; border: 1px solid rgba(216, 167, 167, 0.3);">
              <p style="font-size: 1.2rem; color: var(--rosewood); margin-bottom: 1.5rem;">Your shopping bag is currently empty.</p>
              <a href="index.html" class="btn-order-now" style="max-width: 250px; margin: 0 auto;">Explore Candles</a>
            </div>
          `;
          return;
        }

        const allSelected = cart.length > 0 && selectedIndices.size === cart.length;
        let selectedSubtotal = 0;

        let itemsHTML = `
          <div class="cart-items-list">
            <div class="select-all-bar">
              <label class="checkbox-label">
                <input type="checkbox" class="lumiere-checkbox" ${allSelected ? 'checked' : ''} onchange="toggleSelectAll(this.checked)">
                <span>Select All (${selectedIndices.size} of ${cart.length} selected)</span>
              </label>
            </div>
        `;

        cart.forEach((item, index) => {
          const price = cleanPrice(item.price);
          const isChecked = selectedIndices.has(index);
          if (isChecked) {
            selectedSubtotal += price;
          }

          itemsHTML += `
            <div class="cart-item-card ${isChecked ? '' : 'unchecked'}">
              <input 
                type="checkbox" 
                class="lumiere-checkbox" 
                ${isChecked ? 'checked' : ''} 
                onchange="toggleItemSelection(${index}, this.checked)"
              >
              <img src="${item.img}" alt="${item.name}" class="cart-item-img">
              <div class="cart-item-info">
                <h3 class="cart-item-name">${item.name}</h3>
                <p class="cart-item-price">Rs. ${price.toLocaleString()}</p>
              </div>
              <button class="btn-remove" onclick="removeItem(${index})">Remove</button>
            </div>
          `;
        });
        itemsHTML += '</div>';

        const selectedCount = selectedIndices.size;

        // Dynamic Summary Box based ONLY on checked items
        let summaryHTML = `
          <div class="cart-summary-box">
            <h3 class="summary-title">Order Summary</h3>
            <div class="summary-row">
              <span>Selected Items (${selectedCount})</span>
              <span>Rs. ${selectedSubtotal.toLocaleString()}</span>
            </div>
            <div class="summary-row">
              <span>Shipping</span>
              <span>${selectedCount > 0 ? 'FREE' : 'Rs. 0'}</span>
            </div>
            <div class="summary-row summary-total">
              <span>Total Payable</span>
              <span>Rs. ${selectedSubtotal.toLocaleString()}</span>
            </div>
            <button 
              class="btn-order-now" 
              onclick="handleProceedOrder()" 
              ${selectedCount === 0 ? 'disabled' : ''}
            >
              ${selectedCount === 0 ? 'Select Items to Order' : `Proceed to Order (${selectedCount})`}
            </button>
          </div>
        `;

        cartGrid.innerHTML = itemsHTML + summaryHTML;
      }

      // Render Placed Orders Section
      function loadMyOrders() {
        const orders = getOrders();
        navOrderCount.textContent = orders.length;

        if (orders.length === 0) {
          ordersListContainer.innerHTML = `
            <div style="background:#fff; padding:2rem; border-radius:10px; border:1px solid rgba(216,167,167,0.3); text-align:center; color:var(--rosewood);">
              No orders placed yet. Select items from your bag above to place your first order!
            </div>
          `;
          return;
        }

        ordersListContainer.innerHTML = orders.map(order => `
          <div class="order-card">
            <div class="order-card-top">
              <div>
                <span class="tracking-pill">Tracking ID: ${order.trackingId}</span>
                <span style="margin-left: 0.75rem; font-size: 0.85rem; color: #777;">Placed on ${order.date}</span>
              </div>
              <span class="status-badge">● ${order.status}</span>
            </div>
            <div class="order-items-mini">
              ${order.items.map(item => `
                <div class="order-mini-item">
                  <img src="${item.img}" alt="${item.name}">
                  <span><strong>${item.name}</strong> — Rs. ${cleanPrice(item.price).toLocaleString()}</span>
                </div>
              `).join('')}
            </div>
            <div class="order-card-bottom">
              <span>Customer: <strong>${order.customerName}</strong> (${order.address})</span>
              <span style="font-size: 1.05rem; color: var(--deep-plum);">Total Paid: <strong>Rs. ${order.total.toLocaleString()}</strong></span>
            </div>
          </div>
        `).join('');
      }

      // Toggle single item checkbox
      window.toggleItemSelection = function (index, checked) {
        if (checked) {
          selectedIndices.add(index);
        } else {
          selectedIndices.delete(index);
        }
        loadCartPage();
      };

      // Toggle Select All checkbox
      window.toggleSelectAll = function (checked) {
        const cart = getCart();
        selectedIndices.clear();
        if (checked) {
          cart.forEach((_, idx) => selectedIndices.add(idx));
        }
        loadCartPage();
      };

      // Remove item & sync selectedIndices
      window.removeItem = function (index) {
        let cart = getCart();
        cart.splice(index, 1);
        localStorage.setItem('lumiere_cart', JSON.stringify(cart));

        // Rebuild selectedIndices cleanly after index shift
        const updatedSelection = new Set();
        selectedIndices.forEach(oldIdx => {
          if (oldIdx < index) updatedSelection.add(oldIdx);
          else if (oldIdx > index) updatedSelection.add(oldIdx - 1);
        });
        selectedIndices = updatedSelection;

        loadCartPage();
      };

      // Modal Controls
      let shouldPlaceOrderAfterLogin = false;

      window.openAuthModal = function (placeAfter = false) {
        shouldPlaceOrderAfterLogin = placeAfter;
        authModal.classList.add('active');
      };

      window.closeAuthModal = function () {
        authModal.classList.remove('active');
      };

      window.logoutUser = function () {
        localStorage.removeItem('lumiere_user');
        renderUserNav();
      };

      window.toggleUserDropdown = function (event) {
        event.stopPropagation();
        const dropdown = document.getElementById('userDropdown');
        if (dropdown) {
          dropdown.classList.toggle('open');
        }
      };

      // Agar user dropdown ke bahar kahin click kare to dropdown band ho jaye
      document.addEventListener('click', (e) => {
        const dropdown = document.getElementById('userDropdown');
        if (dropdown && !e.target.closest('.user-menu-wrapper')) {
          dropdown.classList.remove('open');
        }
      });

      // Handle Login Form Submit
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const user = {
          name: document.getElementById('userName').value.trim(),
          contact: document.getElementById('userEmail').value.trim(),
          address: document.getElementById('userAddress').value.trim()
        };
        localStorage.setItem('lumiere_user', JSON.stringify(user));
        closeAuthModal();
        renderUserNav();

        if (shouldPlaceOrderAfterLogin) {
          completeSelectedOrder();
        }
      });

      // Check Login before Ordering
      window.handleProceedOrder = function () {
        if (selectedIndices.size === 0) {
          alert("Please select at least one candle to order.");
          return;
        }
        const user = getCurrentUser();
        if (!user) {
          openAuthModal(true);
        } else {
          completeSelectedOrder();
        }
      };

      // Finalize Order, Generate Tracking ID & Move Checked Items to My Orders
      function completeSelectedOrder() {
        const cart = getCart();
        const user = getCurrentUser();
        const orderedItems = [];
        const remainingCart = [];
        let orderTotal = 0;

        cart.forEach((item, index) => {
          if (selectedIndices.has(index)) {
            orderedItems.push(item);
            orderTotal += cleanPrice(item.price);
          } else {
            remainingCart.push(item);
          }
        });

        // Generate Unique Tracking ID (e.g., LUM-482910)
        const randomDigits = Math.floor(100000 + Math.random() * 900000);
        const trackingId = `LUM-${randomDigits}`;

        const newOrder = {
          trackingId: trackingId,
          date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
          customerName: user.name,
          address: user.address,
          items: orderedItems,
          total: orderTotal,
          status: 'Order Confirmed & Processing'
        };

        // Save order to My Orders
        const orders = getOrders();
        orders.unshift(newOrder); // Newest order first
        localStorage.setItem('lumiere_orders', JSON.stringify(orders));

        // Update cart with only unchecked items
        localStorage.setItem('lumiere_cart', JSON.stringify(remainingCart));
        selectedIndices.clear();
        remainingCart.forEach((_, idx) => selectedIndices.add(idx));

        loadCartPage();
        loadMyOrders();

        alert(`🎉 Order Placed Successfully!\n\nYour Tracking ID: ${trackingId}\nYou can track your order below in the "My Orders" section.`);
        document.getElementById('myOrdersSection').scrollIntoView({ behavior: 'smooth' });
      }

      // Initialize page
      renderUserNav();
      loadCartPage();
      loadMyOrders();
    });
  </script>
</body>

</html>
